spring.application.name=ms-jugadores
server.port=8082

# Base de datos H2 en archivo: los datos sobreviven a reinicios (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/jugadoresdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8082/h2-console
spring.h2.console.enabled=true

# Dirección del microservicio de puntos
ms-puntos.url=http://localhost:8081