spring.application.name=ms-puntos
server.port=8081

# Base de datos H2 en archivo: los datos sobreviven a reinicios (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/puntosdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Para MySQL: cambiar url/usuario/clave y agregar la dependencia mysql-connector-j al pom.xml
